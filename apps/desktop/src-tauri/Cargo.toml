[package]
name = "janja-share"
version = "0.1.0"
description = "P2P screen sharing for Windows"
authors = ["sams"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "janja_share_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
# Native acrylic/mica blur. A CSS backdrop-filter cannot frost what is behind
# the window, only what is inside it.
window-vibrancy = "0.6"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
