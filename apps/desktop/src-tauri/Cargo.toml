[package]
name = "janja-share"
version = "0.2.0"
description = "P2P screen sharing for Windows"
authors = ["sams"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "janja_share_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
# Native acrylic/mica blur. A CSS backdrop-filter cannot frost what is behind
# the window, only what is inside it.
window-vibrancy = "0.6"

# Per-application audio capture. getDisplayMedia only ever returns a
# system-wide loopback mix, which drags every notification and every voice
# call into the stream. Version pinned to what Tauri already pulls in, so
# there is one copy of the bindings rather than two.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }
# The #[implement] macro expands to windows_core:: paths, so that crate has to
# be nameable in its own right.
windows-core = "0.61"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
# A fullscreen game has to be left behind to reach the tray, and leaving it is
# what minimises it — which is exactly what makes the window uncapturable. The
# shortcut is what lets a share start without ever leaving the game.
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
