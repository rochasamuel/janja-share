# coturn configuration for janja-share.
#
# Secrets are NOT in this file. The realm and static-auth-secret are passed as
# command-line flags from docker-compose.yml, which reads them from .env, so
# this file is safe to commit.

# --- Listening ---------------------------------------------------------------
listening-port=3478
tls-listening-port=5349

# --- Relay port range --------------------------------------------------------
# Every concurrent relayed stream consumes a port from this range. 40 ports is
# ample for one sharer and six viewers; keep it bounded so the firewall rule
# stays narrow.
min-port=49160
max-port=49200

# --- Authentication ----------------------------------------------------------
# Time-limited REST credentials: the signaling server issues
# username="<expiry>:<sessionId>" with an HMAC-SHA1 password. coturn validates
# them against the shared secret with no user database.
use-auth-secret
# static-auth-secret and realm come from docker-compose.yml

# Rejects requests whose message integrity does not check out.
fingerprint

# --- Hardening ---------------------------------------------------------------
# This relay exists to forward one screen share between known peers. Everything
# below closes off the ways an open TURN server gets abused as a proxy.
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

# Refuse to relay to loopback and link-local space.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=::1
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Per-user and total bandwidth ceilings, in kbit/s. A 1080p60 screen share sits
# around 6000; 12000 leaves headroom without letting one client take the box.
user-quota=12000
total-quota=120000

stale-nonce=600

# --- Logging -----------------------------------------------------------------
# Credentials must never reach the log.
log-file=stdout
no-stdout-log=false
simple-log
