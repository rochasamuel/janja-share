# The whole server side: TLS termination, signaling, and the TURN relay.
#
# On a fresh VPS this is the only thing you run. See deploy.sh, which fills in
# .env and starts it.

services:
  caddy:
    image: caddy:2-alpine
    container_name: janja-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    depends_on:
      - signaling

  signaling:
    build:
      context: ..
      dockerfile: apps/signaling/Dockerfile
    image: janja-signaling:latest
    container_name: janja-signaling
    restart: unless-stopped
    # No published ports on purpose. Caddy reaches it over the internal
    # network, so plaintext ws:// is never exposed to the internet.
    expose:
      - "8787"
    environment:
      SIGNALING_PORT: 8787
      MAX_VIEWERS: ${MAX_VIEWERS:-6}
      STUN_URL: ${STUN_URL:-stun:stun.l.google.com:19302}
      TURN_URL: ${TURN_URL}
      TURN_TLS_URL: ${TURN_TLS_URL}
      TURN_REALM: ${TURN_REALM}
      TURN_SECRET: ${TURN_SECRET}
      TURN_TTL_SECONDS: ${TURN_TTL_SECONDS:-3600}
    networks:
      - edge

  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: janja-coturn
    restart: unless-stopped
    # Host networking is required, not a preference. Behind Docker's NAT
    # coturn advertises container-internal addresses, so it looks healthy and
    # relays nothing.
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --realm=${TURN_REALM:?set TURN_REALM in .env}
      - --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env}
      - --external-ip=${PUBLIC_IP:?set PUBLIC_IP in .env}

networks:
  edge:

volumes:
  caddy-data:
  caddy-config:
