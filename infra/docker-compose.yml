# The whole server side: signaling plus the TURN relay.
#
# Run this on a small VPS. Copy .env.example to .env next to this file and
# fill in TURN_SECRET and TURN_REALM before starting.

services:
  signaling:
    build:
      context: ..
      dockerfile: apps/signaling/Dockerfile
    image: janja-signaling:latest
    container_name: janja-signaling
    restart: unless-stopped
    # Bound to loopback: the reverse proxy terminates TLS and forwards here.
    # Exposing 8787 directly would serve ws:// in the clear.
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      SIGNALING_PORT: 8787
      MAX_VIEWERS: ${MAX_VIEWERS:-6}
      STUN_URL: ${STUN_URL:-stun:stun.l.google.com:19302}
      TURN_URL: ${TURN_URL}
      TURN_TLS_URL: ${TURN_TLS_URL}
      TURN_REALM: ${TURN_REALM}
      TURN_SECRET: ${TURN_SECRET}
      TURN_TTL_SECONDS: ${TURN_TTL_SECONDS:-3600}

  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: janja-coturn
    restart: unless-stopped
    # Host networking is required. Behind Docker's NAT, coturn advertises
    # container-internal addresses and relays nothing while looking healthy.
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --realm=${TURN_REALM:?set TURN_REALM in .env}
      - --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env}
      # Required on any VPS whose NIC holds a private address:
      # - --external-ip=203.0.113.10
